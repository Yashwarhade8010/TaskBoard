name: ci

on: 
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run: 
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend,frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Create .env for CI
        run: cp .env.example .env

      - name: Build and Start the Stack
        run: docker compose up -d --build
      
      - name: Wait for the API and run a smoke test
        run: |
          for i in $(seq 1 40); do
            curl  -fsS http://localhost:8080/api/tasks && break
            echo "waiting for the app...."
            sleep 3
          done
          curl -fsS -X POST http://localhost:8080/api/tasks \
             -H 'Content-Type: application/json' \
             -d '{"title":"ci smoke test"}'
          curl -fsS http://localhost:8080/api/tasks | grep -q "ci smoke test"

      - name: Show logs if something failed
        if: failure()
        run: docker compose logs --no-color

      - name: Clean up
        if: always()
        run: docker compose down -v