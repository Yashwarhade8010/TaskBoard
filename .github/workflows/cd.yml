name: cd

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: set image names and tag
        run: |
          echo "PREFIX=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
          echo "TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - uses: docker/setup-buildx-action@v3

      - name: build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.PREFIX }}/taskboard-backend:latest
            ${{ env.PREFIX }}/taskboard-backend:${{ env.TAG }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.PREFIX }}/taskboard-frontend:latest
            ${{ env.PREFIX }}/taskboard-frontend:${{ env.TAG }}
          labels: irg.opencontainers.image.source=https://github.com/${{ github.repository }}
 
  deploy:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" >> ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
        
      - name: Deploy
        env:
          HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@"$HOST" \
            "cd ~/taskboard & docker compose pull && docker compose up -d && docker image prune -f"
        
      - name: Smoke test
        env:
          HOST: ${{ secrets.EC2_HOST }}
        run: |
          for i in $(seq 1 20); do
            curl fsS "http://$HOST/api/tasks" && exit 0
            sleep 3
          done
          echo "app did not after deploy"
          exit 1



          